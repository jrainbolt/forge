# Copy this file outside the repository and replace both model paths.

# Optional trusted local project commands. Forge exposes only these two named
# operations in assist mode; argv is never supplied by the model or shell-parsed.
[project.commands.build]
argv = ["python", "-m", "compileall", "src"]
timeout_seconds = 120

[project.commands.test]
argv = ["python", "-m", "pytest"]
timeout_seconds = 300

[models.qwen-small]
backend = "llama.cpp"
model_id = "Qwen2.5-Coder-7B-Instruct"

[models.qwen-small.backend_config]
model_path = "/path/to/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf"
context_size = 8192
gpu_layers = -1
verbose = false

[models.qwen-large]
backend = "llama.cpp"
model_id = "Qwen3-Coder-30B-A3B-Instruct"

[models.qwen-large.backend_config]
model_path = "/path/to/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf"
context_size = 8192
gpu_layers = -1
verbose = false
