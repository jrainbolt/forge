[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-coding-assistant"
dynamic = ["version"]
description = "A local-first AI coding assistant with interchangeable language models"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Forge contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
llama = [
    "llama-cpp-python>=0.3.35,<0.4",
]
semantic = [
    "llama-cpp-python>=0.3.35,<0.4",
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "forge.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forge.evaluation" = [
    "fixtures/eval_repo/README.md",
    "fixtures/eval_repo/src/tinyqueue/__init__.py",
    "fixtures/eval_repo/src/tinyqueue/models.py",
    "fixtures/eval_repo/src/tinyqueue/retry.py",
    "fixtures/eval_repo/src/tinyqueue/service.py",
    "fixtures/eval_repo/src/tinyqueue/storage.py",
    "fixtures/eval_repo/tests/test_retry.py",
    "fixtures/eval_repo/tests/test_service.py",
    "fixtures/eval_repo/tests/test_storage.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "src"]
norecursedirs = ["tests/fixtures"]
markers = [
    "integration: requires an explicitly configured local model",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
